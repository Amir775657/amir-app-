  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;

              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');

      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

        eventName,

  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {

      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });

      return originalRAF.call(window, callback);

<meta charset="UTF-8">

<title>طريق الأمير</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px circle at 50% 0%,rgba(212,175,55,0.08),transparent 60%),radial-gradient(600px circle at 80% 80%,rgba(212,175,55,0.04),transparent 60%);pointer-events:none;z-index:0}
.container{position:relative;z-index:10;max-width:1140px;margin:0 auto;padding:0 20px}
.topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.badge{background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(0,0,0,0.4));border:1px solid rgba(212,175,55,0.25);backdrop-filter:blur(16px);padding:8px 16px;border-radius:14px;display:flex;align-items:center;gap:10px}
.badge-label{font-size:11px;color:rgba(255,255,255,0.6);font-weight:600}
.badge-value{font-size:17px;font-weight:800;color:#10b981}
.badge-value.gold{color:#FFD700}
.dot{width:10px;height:10px;border-radius:50%;background:#10b981;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.5}}
header{padding:100px 0 40px;text-align:center}
h1{font-size:52px;font-weight:300;background:linear-gradient(180deg,#FFD700,#D4AF37,#B8860B);-webkit-background-clip:text;color:transparent}
.tagline{color:#FFD700;font-size:13px;letter-spacing:0.25em;margin-top:14px;font-weight:700}
.subtitle{margin-top:22px;color:rgba(255,255,255,0.7);font-size:15px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.9;font-weight:500}
section{margin-bottom:60px;position:relative}
.sec-title{font-size:26px;font-weight:700;margin-bottom:8px;color:#fff}
.sec-desc{color:rgba(255,255,255,0.55);font-size:14px;margin-bottom:26px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));border:1px solid rgba(212,175,55,0.18);border-radius:22px;padding:22px;backdrop-filter:blur(20px);transition:0.3s}
.card:hover{border-color:rgba(255,215,0,0.35);transform:translateY(-3px);box-shadow:0 10px 30px rgba(212,175,55,0.1)}
.card-title{text-align:center;font-size:14px;color:#FFD700;margin-bottom:16px;font-weight:800;letter-spacing:0.08em}
.exchange{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:16px;margin-bottom:14px}
.side{text-align:center}
.side:first-child{border-left:1px solid rgba(255,255,255,0.12);padding-left:10px}
.side-label{font-size:11px;color:rgba(255,255,255,0.6);font-weight:700;margin-bottom:2px}
.word-en{font-size:26px;font-weight:800;color:#fbbf24;margin-top:6px;letter-spacing:0.02em}
.word-cn{font-size:32px;font-weight:700;color:#fff;margin-top:6px}
.pron{font-size:20px;color:#FFD700;margin-top:8px;font-weight:800;text-shadow:0 0 14px rgba(255,215,0,0.3);letter-spacing:0.01em;line-height:1.3}
.pron-cn{font-size:20px;color:#FFD700;margin-top:8px;font-weight:800;text-shadow:0 0 14px rgba(255,215,0,0.3);letter-spacing:0.01em;line-height:1.3}
.btns{display:flex;justify-content:center;gap:8px;margin-top:14px}
.btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:none;font-size:15px;transition:0.2s}
.btn-audio{background:linear-gradient(135deg,#FFEC8B,#FFD700);color:#000;box-shadow:0 4px 12px rgba(255,215,0,0.2)}
.btn-audio:active{transform:scale(0.92)}
.btn-mic{background:rgba(255,255,255,0.08);border:1px solid rgba(212,175,55,0.3);color:rgba(255,255,255,0.8)}
.btn-mic:active{transform:scale(0.92)}
.btn-mic.on{background:#ef4444;border-color:#ef4444;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.status{margin-top:8px;font-size:11px;color:rgba(255,255,255,0.45);min-height:16px;font-weight:600}
.status.ok{color:#10b981}
.status.bad{color:#ef4444}
.success{text-align:center;font-size:13px;color:#10b981;display:none;margin-top:8px;font-weight:800}
.success.show{display:block}
.studio{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:20px}
.video-box{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
video{width:100%;height:100%;object-fit:cover;display:none}
video.show{display:block}
.placeholder{text-align:center}
.placeholder-ico{font-size:36px;margin-bottom:6px}
.placeholder-txt{font-size:12px;color:rgba(255,255,255,0.4)}
.rec-dot{position:absolute;top:12px;right:12px;background:#dc2626;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;display:none}
.rec-dot.show{display:block;animation:p 1s infinite}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl-btn{padding:12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-align:center;transition:0.2s}
.ctrl-btn:active{transform:scale(0.98)}
.ctrl-btn.sec{background:rgba(255,255,255,0.1);color:#fff;grid-column:1/-1}
.ctrl-btn.pri{background:linear-gradient(to right,#f59e0b,#10b981);color:#000}
.ctrl-btn.pri:disabled{opacity:0.4;cursor:not-allowed}
.ctrl-btn.dl{background:#D4AF37;color:#000;display:none;text-decoration:none}
.ctrl-btn.dl.show{display:block;grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);opacity:0;transition:0.4s;z-index:100;background:rgba(0,0,0,0.9);border:1px solid rgba(212,175,55,0.4);padding:10px 20px;border-radius:999px;backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-txt{font-size:13px;color:#FFD700;white-space:nowrap;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
<div class="badge"><div class="dot"></div><div><div class="badge-label">أرباحك</div><div class="badge-value"><span id="earned">0.00</span> $</div></div></div>
<div class="badge"><div><div class="badge-label">التبادلات</div><div class="badge-value gold"><span id="count">0</span>/5</div></div><div style="width:24px;height:24px;background:rgba(212,175,55,0.2);border-radius:50%;display:grid;place-items:center;font-size:12px">🤝</div></div>
</div>

<div class="container">
<header>
<h1>طريق الأمير</h1>
<div class="tagline">تعلم كلمة تكسب لقمة</div>
<p class="subtitle">علم زميلك كلمة <b style="color:#fbbf24">إنجليزية</b>، وسيعلمك كلمة <b style="color:#10b981">صينية</b>!</p>
</header>

<section>
<h2 class="sec-title">غرف التبادل</h2>
<p class="sec-desc">اضغط الميكروفون لفحص النطق بالذكاء الاصطناعي</p>
<div class="grid" id="grid"></div>
</section>

<section>
<h2 class="sec-title">استوديو التسجيل</h2>
<p class="sec-desc">سجل فيديو مشترك لإثبات التبادل</p>
<div class="studio">
<div class="video-box">
<video id="vid" autoplay muted playsinline></video>
<div class="placeholder" id="ph"><div class="placeholder-ico">👥</div><p class="placeholder-txt">سجل فيديو التبادل</p></div>
<div class="rec-dot" id="recDot">REC</div>
</div>
<div class="controls">
<button class="ctrl-btn sec" onclick="cam()">تفعيل الكاميرا</button>
<button class="ctrl-btn pri" id="rb" onclick="toggleRec()" disabled>ابدأ التسجيل 🎥</button>
<a class="ctrl-btn dl" id="dl">تحميل الفيديو 📥</a>
</div>
</div>
</section>
</div>

<div class="toast" id="toast"><div class="toast-txt" id="tt">تم</div></div>

<script>
const data=[
 {en:'hello',ea:'هَلُو',cn:'你好',cp:'نِي هَاو',t:'التحية'},
 {en:'thank you',ea:'ثَانْك يُو',cn:'谢谢',cp:'شِيِه شِيه',t:'الشكر'},
 {en:'how much',ea:'هَاو مَتْش',cn:'多少钱',cp:'دُو شَاو تشْيَان',t:'السعر'},
 {en:'too expensive',ea:'تُو إكْسْبِنْسِف',cn:'太贵了',cp:'تَاي قُوِي لَه',t:'التفاوض'},
 {en:'I want',ea:'آي وَنت',cn:'我要',cp:'وُو يَاو',t:'أريد'},
 {en:'cheap',ea:'تْشِيب',cn:'便宜',cp:'بْيَان يِي',t:'رخيص'},
 {en:'quality',ea:'كْوَالِتِي',cn:'质量',cp:'جِه لْيَانْغ',t:'جودة'},
 {en:'sample',ea:'سَامْبِل',cn:'样品',cp:'يَانْغ بِين',t:'عينة'},
 {en:'ship',ea:'شِب',cn:'发货',cp:'فَا هُوُو',t:'شحن'},
 {en:'WeChat',ea:'وِي تْشَات',cn:'微信',cp:'وَي شِين',t:'ويشات'}
];

let done={}, total=0, money=0;

function spk(t,l){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=l;
  u.rate=0.85;
  speechSynthesis.speak(u);
}

function chk(txt,lang,btn,card){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('استخدم Chrome للفحص');return}
  const r=new SR();
  r.lang=lang;
  r.interimResults=false;
  r.maxAlternatives=1;
  btn.classList.add('on');
  const s=btn.parentElement.nextElementSibling;
  s.textContent='يسمع...';
  s.className='status';
  r.start();
  r.onresult=e=>{
    const res=e.results[0][0].transcript.toLowerCase();
    btn.classList.remove('on');
    if(res.includes(txt.toLowerCase())){
      s.textContent='✓ صحيح';
      s.className='status ok';
      prog(card,lang);
    }else{
      s.textContent='✗ حاول مجدداً';
      s.className='status bad';
    }
  };
  r.onerror=()=>{
    btn.classList.remove('on');
    s.textContent='حاول مرة أخرى';
    s.className='status bad';
  };
  r.onend=()=>btn.classList.remove('on');
}

function prog(c,l){
  const id=c.dataset.id;
  if(!done[id])done[id]={};
  done[id][l]=1;
  if(done[id]['en-US']&&done[id]['zh-CN']&&!done[id].ok){
    done[id].ok=1;
    c.querySelector('.success').classList.add('show');
    total++;
    document.getElementById('count').textContent=total;
    if(total%5===0){
      money+=1;
      document.getElementById('earned').textContent=money.toFixed(2);
      toast('🎉 ربحت $1.00!');
    }else{
      toast('✓ تم التبادل بنجاح');
    }
  }
}

function render(){
  document.getElementById('grid').innerHTML=data.map((d,i)=>`
  <div class="card" data-id="${i}">
    <div class="card-title">${d.t}</div>
    <div class="exchange">
      <div class="side">
        <div class="side-label">إنجليزي</div>
        <div class="word-en">${d.en}</div>
        <div class="pron">${d.ea}</div>
        <div class="btns">
          <button class="btn btn-audio" onclick="spk('${d.en}','en-US')">🔊</button>
          <button class="btn btn-mic" onclick="chk('${d.en}','en-US',this,this.closest('.card'))">🎤</button>
        </div>
        <div class="status">اختبر النطق</div>
      </div>
      <div class="side">
        <div class="side-label">صيني</div>
        <div class="word-cn">${d.cn}</div>
        <div class="pron-cn">${d.cp}</div>
        <div class="btns">
          <button class="btn btn-audio" onclick="spk('${d.cn}','zh-CN')">🔊</button>
          <button class="btn btn-mic" onclick="chk('${d.cn}','zh-CN',this,this.closest('.card'))">🎤</button>
        </div>
        <div class="status">اختبر النطق</div>
      </div>
    </div>
    <div class="success">✓ تم التبادل</div>
  </div>`).join('');
}

let stream=null, recorder=null, chunks=[];
async function cam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    const v=document.getElementById('vid');
    v.srcObject=stream;
    v.classList.add('show');
    document.getElementById('ph').style.display='none';
    document.getElementById('rb').disabled=false;
    toast('الكاميرا جاهزة');
  }catch(e){
    toast('يرجى السماح بالكاميرا')
  }
}

function toggleRec(){
  if(!stream){toast('فعّل الكاميرا أولاً');return}
  const b=document.getElementById('rb');
  const d=document.getElementById('recDot');
  if(recorder && recorder.state==='recording'){
    recorder.stop();
    b.textContent='ابدأ التسجيل 🎥';
    d.classList.remove('show');
    return;
  }
  chunks=[];
  try{
    recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
  }catch(e){
    recorder=new MediaRecorder(stream);
  }
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.getElementById('dl');
    a.href=URL.createObjectURL(blob);
    a.download='tariq-al-amir.webm';
    a.classList.add('show');
    toast('تم حفظ الفيديو');
  };
  recorder.start();
  b.textContent='⏹️ إيقاف التسجيل';
  d.classList.add('show');
}

function toast(t){
  const el=document.getElementById('toast');
  document.getElementById('tt').textContent=t;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

render();
</script>
