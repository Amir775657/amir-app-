<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<title>طريق الأمير 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E13;
  --bg-e:#181822;
  --card:#1E1E2E;
  --border:#2E2E40;
  --text:#F9F9FB;
  --text-2:#A8A9B8;
  --text-3:#7A7B8C;
  --gold:#FFD84D;
  --gold2:#FFC61A;
  --gold-bg:rgba(255,216,77,0.08);
  --gold-bd:rgba(255,216,77,0.22);
  --r-xl:20px;
  --r-pill:100px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.app{max-width:460px;margin:0 auto;padding:16px;min-height:100vh;padding-bottom:50px}

/* الهيدر وشريط التقدم */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.h-brand{display:flex;align-items:center;gap:10px}
.h-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:20px}
.h-title{font-size:17px;font-weight:900;color:#fff}
.h-sub{font-size:10.5px;color:var(--text-2)}

.progress-container{background:var(--bg-e);border:1px solid var(--border);border-radius:var(--r-pill);height:12px;overflow:hidden;margin-bottom:16px;position:relative}
.progress-bar{background:linear-gradient(90deg,var(--gold),var(--gold2));height:100%;width:0%;transition:width .3s ease}

/* التبويب الرئيسي */
.main-tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--bg-e);padding:4px;border-radius:14px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;color:var(--text-2);font-weight:800;font-size:12px;cursor:pointer;text-align:center;background:transparent;transition:all .2s}
.tab-btn.active{background:var(--gold);color:#000}

.section-page{display:none}
.section-page.active{display:block;animation:fadeIn .25s ease}

/* بطاقات التحدي اللساني */
.challenge-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;margin-bottom:16px}
.ch-header{text-align:center;margin-bottom:14px}
.ch-title{color:var(--gold);font-size:16px;font-weight:900}
.ch-desc{font-size:11px;color:var(--text-2);margin-top:2px}

.words-list{display:grid;gap:10px;margin:12px 0}
.word-item-wrap{background:var(--bg-e);border:1px solid var(--border);border-radius:14px;padding:12px;transition:all .2s}
.word-item-wrap:hover{border-color:var(--gold-bd)}
.word-main{display:flex;align-items:center;justify-content:space-between}
.word-cn{font-size:17px;font-weight:700;color:#fff;font-family:'Noto Sans SC',sans-serif}
.word-en{font-size:11px;color:var(--text-3);font-weight:700}
.word-py{font-size:10.5px;color:var(--gold);margin-top:1px}
.word-ar{font-size:13px;font-weight:700;color:var(--text)}

.word-actions{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);flex-wrap:wrap}
.audio-btn{background:var(--gold-bg);border:1px solid var(--gold-bd);color:var(--gold);padding:4px 8px;border-radius:8px;font-size:10.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.quote-toggle,.copy-btn{background:none;border:none;color:var(--text-3);font-size:10.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.quote-toggle:hover,.copy-btn:hover{color:var(--gold)}

.quote-content{display:none;background:rgba(0,0,0,0.3);border-right:3px solid var(--gold);padding:10px;border-radius:4px 8px 8px 4px;margin-top:8px;font-size:11px;color:#EAEAEA;line-height:1.5}
.quote-content.show{display:block;animation:fadeIn .2s ease}

/* نموذج الإرسال والسجل */
.form-group{margin-top:12px}
.form-group label{font-size:11px;color:var(--text-2);margin-bottom:4px;display:block;font-weight:700}
.form-group input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg-e);color:#fff;font-size:12px;outline:none}
.btn-submit{width:100%;margin-top:16px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;border:none;padding:13px;border-radius:12px;font-weight:900;font-size:13.5px;cursor:pointer}

.history-box{margin-top:14px;padding:10px;background:var(--bg-e);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--text-2)}

/* موسوعة أمهات الكتب */
.book-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;margin-bottom:14px}
.book-badge{display:inline-block;padding:3px 9px;background:var(--gold-bg);border:1px solid var(--gold-bd);border-radius:6px;font-size:10px;color:var(--gold);font-weight:800;margin-bottom:8px}
.book-title{font-size:15px;font-weight:800;color:#fff}
.book-author{font-size:11px;color:var(--text-3);margin-bottom:10px}
.book-text{font-size:12px;color:var(--text-2);line-height:1.6;margin-bottom:12px}
.gold-quote{background:rgba(0,0,0,0.35);border-right:3px solid var(--gold);padding:10px 12px;border-radius:4px 8px 8px 4px;font-size:11.5px;color:#EAEAEA;font-style:italic;line-height:1.5}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="app">
  <!-- الهيدر الرئيسي -->
  <div class="header">
    <div class="h-brand">
      <div class="h-logo">ع</div>
      <div>
        <div class="h-title">طريق الأمير 👑</div>
        <div class="h-sub">التحدي اللساني الموسع وأمهات الكتب</div>
      </div>
    </div>
  </div>

  <!-- شريط التقدم الإجمالي -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- التبويب الرئيسية -->
  <div class="main-tabs">
    <button class="tab-btn active" onclick="switchTab('challenge', event)">🎙️ التحدي اللساني (10 مفردات)</button>
    <button class="tab-btn" onclick="switchTab('books', event)">📜 موسوعة أمهات الكتب</button>
  </div>

  <!-- الصفحة الأولى: التحدي اللساني -->
  <div id="page-challenge" class="section-page active">
    <div class="challenge-box">
      <div class="ch-header">
        <div class="ch-title">🎙️ نزهة التحدي اللساني الثلاثي (AR➔EN➔ZH)</div>
        <div class="ch-desc">استمع للنطق بالصينية والإنجليزية، استمتع بالحكمة، ثم سجل مقطعك الشامل بطلاقة</div>
      </div>

      <div class="words-list" id="challengeWords"></div>

      <div class="form-group">
        <label>الاسم الكامل 📝</label>
        <input type="text" id="userName" value="امير محمد حسن غالب السعيدي" oninput="saveUserData()">
      </div>
      <div class="form-group">
        <label>رابط فيديو أو صوت التحدي 🎬</label>
        <input type="url" id="mediaLink" placeholder="ضع رابط Google Drive أو YouTube" oninput="saveUserData()">
      </div>

      <button class="btn-submit" onclick="submitChallenge()">إرسال التحدي للمراجعة 🚀</button>

      <div class="history-box" id="historyBox">
        ⏳ لم يتم إرسال أي تحدي حتى الآن.
      </div>
    </div>
  </div>

  <!-- الصفحة الثانية: أمهات الكتب -->
  <div id="page-books" class="section-page">
    <div id="booksContainer"></div>
  </div>
</div>

<script>
// البيانات الشاملة
const challengeData = [
  { cn: "你好", en: "Hello", py: "nǐ hǎo", ar: "مرحباً", quote: "«أَفْشُوا السَّلَامَ بَيْنَكُمْ تَحَابُّوا، فَإِنَّ التَّحِيَّةَ أُنْسُ النُّفُوسِ.» — الأغاني للأصفهاني" },
  { cn: "谢谢", en: "Thank you", py: "xiè xie", ar: "شكراً", quote: "«مَنْ لَمْ يَشْكُرِ الْقَلِيلَ لَمْ يَشْكُرِ الْكَثِيرَ، وَالشُّكْرُ ثَبَاتُ النِّعَمِ.» — صيد الخاطر" },
  { cn: "多少钱", en: "How much?", py: "duō shǎo qián", ar: "كم السعر؟", quote: "«العِلْمُ بِالقِيمَةِ قَبْلَ الشِّرَاءِ يَقِي المَغْبُونَ مَرارَةَ النَّدَمِ.» — مقدمة ابن خلدون" },
  { cn: "太贵了", en: "Too expensive", py: "tài guì le", ar: "غالي جداً", quote: "«الاقْتِصَادُ فِي النَّفَقَةِ نِصْفُ المَعِيشَةِ، وَالرِّفْقُ يَزِينُ التَّجَارَةَ.» — البخلاء للجاحظ" },
  { cn: "便宜一点", en: "A bit cheaper", py: "pián yi yì diǎn", ar: "أرخص قليلاً", quote: "«السَّمَاحَةُ فِي البَيْعِ وَالشِّرَاءِ بَرَكَةٌ تُنْمِي المَالَ وَتَشُدُّ العُرَى.» — أدب الدُّنْيَا وَالدِّينِ" },
  { cn: "最低价", en: "Lowest price", py: "zuì dī jià", ar: "أقل سعر", quote: "«أَكْرَمُ التِّجَارَةِ مَا قَامَ عَلَى الصِّدْقِ وَخَفَّتْ فِيهِ المَؤُونَةُ.» — كتاب الأموال" },
  { cn: "订金", en: "Deposit", py: "dìng jīn", ar: "عربون", quote: "«العُقُودُ وَثَاقُ العُهُودِ، وَبِهَا تَسْتَقِيمُ أَمْوَالُ النَّاسِ وَتَسْلَمُ.» — مقدمة ابن خلدون" },
  { cn: "工厂", en: "Factory", py: "gōng chǎng", ar: "مصنع", quote: "«مَنْ أَمْضَى يَوْمَهُ فِي غَيْرِ حَقٍّ قَضَاهُ، أَوْ مَجْدٍ بَنَاهُ؛ فَقَدْ ظَلَمَ يَوْمَهُ.» — صيد الخاطر" },
  { cn: "样品", en: "Sample", py: "yàng pǐn", ar: "عينة", quote: "«الدَّلِيلُ الصَّغِيرُ يَدُلُّ عَلَى الكَثِيرِ المَسْتُورِ، وَالعَيْنُ مِيزَانُ الخَبِيرِ.» — كليلة ودمنة" },
  { cn: "海运", en: "Sea freight", py: "hǎi yùn", ar: "شحن بحري", quote: "«تَجْرِي الرِّيَاحُ بِمَا لا تَشْتَهِي السُّفُنُ، وَالحَزْمُ يَقِي الغَرَقَ.» — ديوان المتنبي" }
];

const booksData = [
  { tag: "صناعة الفكر والإدارة", title: "مقدمة ابن خلدون: فلسفة العمران والتجارة", author: "المؤلف: عبد الرحمن بن خلدون (توفي 808 هـ)", summary: "المرجع التأسيسي الأول لعلم الاجتماع البشري والديناميكيات الاقتصادية. يشرح ابن خلدون كيف ترتبط أرزاق الشعوب بالاستقرار التنظيمي وحرية الحركة التجارية وتأثير الأسواق على قوة الدول.", quote: "«إنّ الخَرابَ يَسْتَوْلِي عَلَى المَمالِكِ إذَا قَلَّ العَمَرُ وَانْقَطَعَ التَّجَارُ، وَالعَدْلُ مِيزَانُ العُمْرَانِ.»" },
  { tag: "المال والاقتصاد", title: "ثروة الأمم: المحرك الأساسي لأسواق العالم", author: "المؤلف: آدم سميث (1776 م)", summary: "العمل الرئيسي الذي وضع قواعد الاقتصاد الحديث والتجارة الدولية. يناقش الكتاب أثر تقسيم العمل، حركة السلع عبر البحار، وتأثير العرض والطلب في تحديد القيمة الحقيقية للمنتجات.", quote: "«تتكون ثروة الأمم الحقيقية من الإنتاج والتبادل الحر المنظم، لا من مجرد تكنيز المعادن.»" },
  { tag: "النفس والقيادة", title: "صيد الخاطر: هندسة الذات وحكمة السلوك", author: "المؤلف: أبو الفرج ابن الجوزي (توفي 597 هـ)", summary: "كتاب فريد صاغ فيه مؤلفه لفتات مركزة في إدارة الوقت، الضبط النفسي أثناء الأزمات، والتفكير الاستراتيجي قبل الإقدام على الصفقات والقرارات الكبرى.", quote: "«من فكّر في عواقب الأمور، سلِم من المزالق، وبنى أمره على الحكمة والوضوح.»" },
  { tag: "البلاغة والمنطق", title: "كليلة ودمنة: الحكمة التكتيكية في الإدارة", author: "المؤلف: عبد الله بن المقفع (توفي 142 هـ)", summary: "شاهكار الأدب السياسي والإداري؛ يقدم الكتاب دروساً بليغة في كيفية إدارة العلاقات، التفاوض والحذر، وفهم طبائع الرجال والشركاء في رحلة العمل والقيادة.", quote: "«لا تَعْتَمِدْ عَلَى الظَّنِّ فِي مَوْضِعِ اليَقِينِ، وَاجْعَلِ الدَّلِيلَ المَلْمُوسَ قَائِدَكَ.»" }
];

let interactedCount = new Set();

// التنقل بين الصفحات
function switchTab(tab, event){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section-page').forEach(p => p.classList.remove('active'));
  
  if(event) event.target.classList.add('active');
  
  if(tab === 'challenge'){
    document.getElementById('page-challenge').classList.add('active');
  } else {
    document.getElementById('page-books').classList.add('active');
  }
}

// محرك النطق ثنائي اللغة
function speakWord(text, lang){
  if('speechSynthesis' in window){
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = lang;
    msg.rate = 0.85;
    window.speechSynthesis.speak(msg);
  }
}

// تعديل شريط التقدم
function updateProgress(id){
  interactedCount.add(id);
  const percent = (interactedCount.size / challengeData.length) * 100;
  document.getElementById('progressBar').style.width = percent + '%';
}

// عرض كلمات التحدي
function renderChallenge(){
  const container = document.getElementById('challengeWords');
  let html = '';
  challengeData.forEach((item, index) => {
    html += `
      <div class="word-item-wrap">
        <div class="word-main">
          <div>
            <div class="word-cn">${item.cn}</div>
            <div class="word-en">${item.en}</div>
            <div class="word-py">${item.py}</div>
          </div>
          <div style="text-align:left">
            <div class="word-ar">${item.ar}</div>
          </div>
        </div>
        <div class="word-actions">
          <button class="audio-btn" onclick="speakWord('${item.cn}', 'zh-CN'); updateProgress(${index})">🇨🇳 صيني</button>
          <button class="audio-btn" onclick="speakWord('${item.en}', 'en-US'); updateProgress(${index})">🇺🇸 إنجليزي</button>
          <button class="quote-toggle" onclick="toggleQuote(${index}); updateProgress(${index})">📜 الشاهد ▾</button>
          <button class="copy-btn" onclick="copyQuote('${item.quote}')">📋 نسخ</button>
        </div>
        <div class="quote-content" id="quote-${index}">${item.quote}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// فتح وإغلاق الشاهد
function toggleQuote(id){
  const el = document.getElementById(`quote-${id}`);
  el.classList.toggle('show');
}

// نسخ الشاهد
function copyQuote(text){
  navigator.clipboard.writeText(text);
  alert('تم نسخ الشاهد الذهبي بنجاح!');
}

// عرض أمهات الكتب
function renderBooks(){
  const container = document.getElementById('booksContainer');
  let html = '';
  booksData.forEach(item => {
    html += `
      <div class="book-card">
        <span class="book-badge">${item.tag}</span>
        <div class="book-title">${item.title}</div>
        <div class="book-author">${item.author}</div>
        <div class="book-text">${item.summary}</div>
        <div class="gold-quote">💡 ${item.quote}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// حفظ بيانات المستخدم محلياً
function saveUserData(){
  const name = document.getElementById('userName').value;
  const link = document.getElementById('mediaLink').value;
  localStorage.setItem('ameer_user_name', name);
  localStorage.setItem('ameer_media_link', link);
}

function loadUserData(){
  const savedName = localStorage.getItem('ameer_user_name');
  const savedLink = localStorage.getItem('ameer_media_link');
  const savedHistory = localStorage.getItem('ameer_history');
  
  if(savedName) document.getElementById('userName').value = savedName;
  if(savedLink) document.getElementById('mediaLink').value = savedLink;
  if(savedHistory) document.getElementById('historyBox').innerHTML = savedHistory;
}

function submitChallenge(){
  const link = document.getElementById('mediaLink').value;
  if(!link){ alert('يرجى وضع رابط الفيديو أو المقطع الصوتي'); return; }
  
  const now = new Date().toLocaleDateString('ar-EG');
  const historyText = `✅ آخر إرسال بنجاح بتاريخ: ${now}`;
  localStorage.setItem('ameer_history', historyText);
  document.getElementById('historyBox').innerHTML = historyText;
  
  alert('تم إرسال التحدي بنجاح!');
}

// التشغيل الأولي
renderChallenge();
renderBooks();
loadUserData();
</script>
</body>
</html>
