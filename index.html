<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طريق الأمير | اليمن هو العالم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-black text-white min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto">

    <!-- Header -->
    <header class="text-center py-4 border-b border-zinc-800">
        <span class="bg-amber-500 text-black font-black px-3 py-1 rounded-full text-xs">طريق الأمير</span>
        <h1 class="text-xl font-black mt-2 text-amber-400">اليمن هو العالم</h1>
        <p class="text-xs text-zinc-400 mt-1">من مأرب.. نربط لغات الأرض بجذورنا</p>
    </header>

    <!-- Main Content -->
    <main class="my-6 space-y-4">
        <!-- زر الانتقال للفيديوهات -->
        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-center">
            <h2 class="text-sm font-bold mb-2">🎬 حلقات التحدي الميداني</h2>
            <p class="text-xs text-zinc-400 mb-3">شاهد حلقاتنا مع شباب المحافظات من مأرب</p>
            <button onclick="alert('تابعنا على منصات التواصل للاطلاع على أحدث الحلقات!')" class="bg-amber-500 text-black font-bold w-full py-2.5 rounded-xl text-sm">
                مشاهدة الحلقات الآن
            </button>
        </div>

        <!-- أكاديمية النطق السريع -->
        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl">
            <h2 class="text-sm font-bold mb-3 text-amber-400">🗣️ تدريب نطق الكلمات</h2>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <button onclick="setWord('Hello', 'إنجليزية')" class="bg-black border border-zinc-800 py-2 rounded-xl text-xs font-bold hover:border-amber-500">Hello</button>
                <button onclick="setWord('Ni Hao', 'صينية')" class="bg-black border border-zinc-800 py-2 rounded-xl text-xs font-bold hover:border-amber-500">Ni Hao</button>
                <button onclick="setWord('Hola', 'إسبانية')" class="bg-black border border-zinc-800 py-2 rounded-xl text-xs font-bold hover:border-amber-500">Hola</button>
            </div>
            <div class="bg-black p-3 rounded-xl flex justify-between items-center border border-zinc-800">
                <span id="active-word" class="text-xs text-zinc-300">اختر كلمة...</span>
                <button onclick="speak()" class="bg-amber-500 text-black px-4 py-1.5 rounded-lg text-xs font-bold">استماع 🔊</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-[10px] text-zinc-600 py-2">
        طريق الأمير © 2026
    </footer>

    <!-- Script -->
    <script>
        let current = "";
        function setWord(word, lang) {
            current = word;
            document.getElementById('active-word').innerText = word + " (" + lang + ")";
        }
        function speak() {
            if(!current) { alert('اختر كلمة أولاً'); return; }
            let speech = new SpeechSynthesisUtterance(current);
            speech.lang = 'en-US';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
