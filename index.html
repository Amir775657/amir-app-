<style id="cautious-dev-v42">
/* === توقف عن اعتبار هذه النسخة ثابتة - طور بحذر - V42 === */
/* V41 كانت مؤسسية جيدة - نطورها بحذر 3% فقط */

:root{
  --c-bg:#070a09;
  --c-bg-h:#0a0f0e;
  --c-bg-card:#111d19;
  --c-bg-card-h:#17231f;
  --c-bg-elev:#0f1a17;
  --c-border:rgba(212,175,55,0.11);
  --c-border-s:rgba(212,175,55,0.19);
  --c-gold:#d4af37;
  --c-gold-l:#f4d35e;
  --c-gold-so:rgba(212,175,55,0.09);
  --c-gold-mi:rgba(212,175,55,0.15);
  --c-sand:#e8d5b5;
  --c-text:#fffef7;
  --c-text-s:rgba(255,254,247,0.70);
  --c-text-t:rgba(255,254,247,0.40);
  --c-r:20px;
  --c-r-sm:14px;
  --c-r-pill:9999px;
  --c-sh:0 10px 36px rgba(0,0,0,0.30);
  --c-sh-sm:0 3px 14px rgba(0,0,0,0.13);
  --c-ease:cubic-bezier(0.4,0,0.2,1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--c-bg) !important;
  color: var(--c-text) !important;
  font-family: 'Cairo', system-ui, sans-serif !important;
  line-height: 1.65 !important;
  -webkit-font-smoothing: antialiased !important;
  -moz-osx-font-smoothing: grayscale !important;
}

/* إخفاء الفوضى - حذر */
div[style*="watermark"], div[style*="rotate(-8deg)"],
div.absolute.inset-0.opacity-\[0\.015\] { display: none !important; }

/* Header - تحسين حذر: 66px بدل 64px + blur خفيف */
header {
  height: 66px !important;
  min-height: 66px !important;
  max-height: 66px !important;
  background: rgba(10,15,14,0.94) !important;
  backdrop-filter: blur(14px) !important;
  -webkit-backdrop-filter: blur(14px) !important;
  border-bottom: 1px solid var(--c-border) !important;
  padding: 0 20px !important;
  box-shadow: 0 1px 0 rgba(212,175,55,0.06), var(--c-sh-sm) !important;
}

/* ط - تحسين حذر: 44px بدل 42px + لمعان داخلي */
header div.w-9, div.w-9 {
  width: 44px !important;
  height: 44px !important;
  min-width: 44px !important;
  background: linear-gradient(135deg, var(--c-gold-l) 0%, var(--c-gold) 100%) !important;
  color: var(--c-bg) !important;
  font-size: 21px !important;
  font-weight: 900 !important;
  border-radius: 13px !important;
  box-shadow: 0 2px 12px rgba(212,175,55,0.22), inset 0 1px 0 rgba(255,255,255,0.32) !important;
  transition: all 0.2s var(--c-ease) !important;
}
header div.w-9:hover {
  transform: scale(1.03) !important;
  box-shadow: 0 4px 16px rgba(212,175,55,0.30), inset 0 1px 0 rgba(255,255,255,0.38) !important;
}

header .cairo { font-size: 17.5px !important; font-weight: 800 !important; letter-spacing: -0.15px !important; }
header .slogan-fade { font-size: 9.5px !important; letter-spacing: 0.55px !important; opacity: 0.88 !important; }

/* تصنيفات - تحسين حذر: تباعد أفضل */
div.flex.gap-2.overflow-x-auto {
  padding: 13px 20px !important;
  gap: 11px !important;
  background: var(--c-bg) !important;
  border-bottom: 1px solid rgba(255,255,255,0.045) !important;
}

div.flex.gap-2.overflow-x-auto > div {
  padding: 8.5px 17px !important;
  font-size: 13.2px !important;
  font-weight: 600 !important;
  background: var(--c-bg-card) !important;
  border: 1px solid rgba(255,255,255,0.065) !important;
  border-radius: var(--c-r-pill) !important;
  transition: all 0.18s var(--c-ease) !important;
}
div.flex.gap-2.overflow-x-auto > div:hover {
  border-color: var(--c-border-s) !important;
  background: var(--c-bg-card-h) !important;
  transform: translateY(-1px) !important;
}

/* إحصائيات - تحسين حذر: أكثر وضوح */
#tariq-stats-bar {
  padding: 15px 20px !important;
  background: var(--c-bg-h) !important;
  border-bottom: 1px solid rgba(255,255,255,0.045) !important;
  gap: 10px !important;
}

#tariq-stats-bar span {
  padding: 6.5px 13px !important;
  font-size: 11.8px !important;
  font-weight: 600 !important;
  background: var(--c-bg-card) !important;
  border: 1px solid rgba(255,255,255,0.055) !important;
  border-radius: var(--c-r-pill) !important;
  transition: all 0.18s var(--c-ease) !important;
}
#tariq-stats-bar span.active {
  background: var(--c-gold-so) !important;
  border-color: var(--c-border-s) !important;
  color: var(--c-gold-l) !important;
  box-shadow: 0 2px 10px var(--c-gold-so) !important;
}

/* خريطة - تحسين حذر: نقاط أوضح */
#tariq-roadmap {
  padding: 17px 20px !important;
  background: var(--c-bg) !important;
  border-bottom: 1px solid rgba(255,255,255,0.035) !important;
  gap: 0 !important;
}

#tariq-roadmap-dots { gap: 8.5px !important; }
.tariq-dot {
  width: 8.5px !important;
  height: 8.5px !important;
  min-width: 8.5px !important;
  background: var(--c-bg-card) !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
}
.tariq-dot.done {
  background: var(--c-gold) !important;
  border-color: var(--c-gold) !important;
  box-shadow: 0 0 8px rgba(212,175,55,0.28) !important;
}
.tariq-dot.current {
  width: 15px !important;
  height: 15px !important;
  min-width: 15px !important;
  background: var(--c-gold-l) !important;
  border: 2.5px solid var(--c-bg) !important;
  box-shadow: 0 0 0 2.5px var(--c-gold), 0 3px 14px rgba(212,175,55,0.38) !important;
}

/* كارد - تحسين حذر: أكثر راحة */
#card {
  margin: 22px 20px !important;
  padding: 30px 22px 24px !important;
  background: linear-gradient(180deg, #16221e 0%, var(--c-bg-card) 100%) !important;
  border-radius: 22px !important;
  border: 1px solid var(--c-border) !important;
  box-shadow: var(--c-sh), 0 0 0 1px rgba(212,175,55,0.04), inset 0 1px 0 rgba(255,255,255,0.03) !important;
}

#card div.h-\[3px\] {
  height: 4px !important;
  background: rgba(255,255,255,0.07) !important;
  border-radius: var(--c-r-pill) !important;
  margin: 0 0 22px 0 !important;
  overflow: hidden !important;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.25) !important;
}
#card div.h-\[3px\] > div {
  background: linear-gradient(90deg, var(--c-gold), var(--c-gold-l)) !important;
  box-shadow: 0 0 10px var(--c-gold-so) !important;
}

/* تاجر - تحسين حذر: 3.8em بدل 3.6em - النقط أوضح */
#arabicWord {
  font-size: 3.85em !important;
  font-weight: 800 !important;
  line-height: 1.05 !important;
  letter-spacing: -0.4px !important;
  margin: 10px 0 22px 0 !important;
  color: var(--c-text) !important;
  text-rendering: optimizeLegibility !important;
}

/* صوت - تحسين حذر: 54px بدل 52px */
#card button.rounded-full {
  width: 54px !important;
  height: 54px !important;
  min-width: 54px !important;
  max-width: 54px !important;
  background: linear-gradient(135deg, var(--c-bg-elev) 0%, var(--c-bg-card) 100%) !important;
  border: 1px solid var(--c-border) !important;
  border-radius: 50% !important;
  margin: 0 auto 22px auto !important;
  box-shadow: var(--c-sh-sm), inset 0 1px 0 rgba(255,255,255,0.04) !important;
  transition: all 0.22s var(--c-ease) !important;
  font-size: 21px !important;
}
#card button.rounded-full:hover {
  transform: scale(1.05) !important;
  border-color: var(--c-border-s) !important;
  box-shadow: 0 6px 20px rgba(212,175,55,0.16), inset 0 1px 0 rgba(255,255,255,0.05) !important;
}

/* نطق - تحسين حذر وذكاء عالي: 18px بدل 17px - النقط واضحة جداً */
#translit {
  font-size: 18px !important;
  font-weight: 700 !important;
  line-height: 1.5 !important;
  letter-spacing: 0.2px !important;
  padding: 9px 20px !important;
  background: linear-gradient(135deg, rgba(232,213,181,0.10) 0%, rgba(232,213,181,0.07) 100%) !important;
  border: 1px solid rgba(232,213,181,0.14) !important;
  color: var(--c-sand) !important;
  border-radius: var(--c-r-pill) !important;
  margin: 0 auto 22px auto !important;
  box-shadow: var(--c-sh-sm), inset 0 1px 0 rgba(255,255,255,0.03) !important;
  text-rendering: optimizeLegibility !important;
  font-feature-settings: "kern" 1, "liga" 1 !important;
}

/* سؤال - تحسين حذر */
#englishPrompt {
  font-size: 17px !important;
  font-weight: 650 !important;
  line-height: 1.5 !important;
  padding: 15px 19px !important;
  background: linear-gradient(135deg, var(--c-bg-elev) 0%, rgba(15,26,23,0.9) 100%) !important;
  border: 1px solid var(--c-border) !important;
  border-right: 3px solid var(--c-gold) !important;
  border-radius: 15px !important;
  margin: 0 0 22px 0 !important;
  color: var(--c-text-s) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), var(--c-sh-sm) !important;
}

/* خيارات - تحسين حذر: 70px بدل 68px - راحة أكثر */
#options {
  gap: 11px !important;
}

#options button {
  min-height: 70px !important;
  padding: 15px 17px !important;
  background: linear-gradient(135deg, var(--c-bg-elev) 0%, var(--c-bg-h) 100%) !important;
  border: 1px solid rgba(255,255,255,0.05) !important;
  border-radius: 15px !important;
  gap: 15px !important;
  transition: all 0.22s var(--c-ease) !important;
  box-shadow: var(--c-sh-sm) !important;
}
#options button:hover {
  background: linear-gradient(135deg, var(--c-bg-card) 0%, var(--c-bg-card-h) 100%) !important;
  border-color: var(--c-border) !important;
  transform: translateY(-1.5px) !important;
  box-shadow: 0 6px 20px rgba(0,0,0,0.16), 0 0 0 1px rgba(212,175,55,0.05) !important;
}
#options button:active {
  transform: translateY(-0.5px) scale(0.99) !important;
}

#options button div.w-\[36px\] {
  width: 44px !important;
  height: 44px !important;
  min-width: 44px !important;
  background: var(--c-bg-card) !important;
  border: 1px solid rgba(255,255,255,0.06) !important;
  border-radius: 11px !important;
  font-size: 20px !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03) !important;
  transition: all 0.22s var(--c-ease) !important;
}
#options button:hover div.w-\[36px\] {
  transform: scale(1.04) !important;
  border-color: var(--c-border) !important;
}

#options button span.font-bold {
  font-size: 17.5px !important;
  font-weight: 700 !important;
  line-height: 1.38 !important;
  letter-spacing: -0.1px !important;
}
</style>

<script id="ai-cautious-v42">
(function(){
  var AI={
    b:[[],[],[],[],[]], w:new Set(), t:0, c:0, s:0, bs:0, day:0, goal:20, xp:0, level:1,
    init:function(){
      try{
        var b=localStorage.getItem('cb'); if(b) this.b=JSON.parse(b);
        var w=localStorage.getItem('cw'); if(w){ var a=JSON.parse(w), s=this; a.forEach(function(x){s.w.add(x);}); }
        this.t=+(localStorage.getItem('ct')||0); this.c=+(localStorage.getItem('cc')||0);
        this.s=+(localStorage.getItem('cs')||0); this.bs=+(localStorage.getItem('cbs')||0);
        this.day=+(localStorage.getItem('cday')||0); this.xp=+(localStorage.getItem('cxp')||0);
        var today=new Date().toDateString(); var last=localStorage.getItem('clast');
        if(last!==today){ this.day=0; localStorage.setItem('clast',today); }
      }catch(e){}
      this.updateLevel();
    },
    save:function(){
      try{
        localStorage.setItem('cb',JSON.stringify(this.b));
        localStorage.setItem('cw',JSON.stringify([...this.w]));
        localStorage.setItem('ct',this.t+''); localStorage.setItem('cc',this.c+'');
        localStorage.setItem('cs',this.s+''); localStorage.setItem('cbs',this.bs+'');
        localStorage.setItem('cday',this.day+''); localStorage.setItem('cxp',this.xp+'');
      }catch(e){}
    },
    updateLevel:function(){
      var xp=this.xp;
      if(xp<100) this.level=1; else if(xp<300) this.level=2; else if(xp<700) this.level=3; else if(xp<1500) this.level=4; else this.level=5;
    },
    levelName:function(){
      var n={1:'مبتدئ 🌱',2:'تاجر 📦',3:'محترف 💼',4:'خبير 👑',5:'أمير ✨'};
      return n[this.level]||n[1];
    },

      if(ok){
        s.b[1].push(id); if(s.w.has(id)) s.w.delete(id);
        s.c++; s.s++; s.day++; s.xp+=10+Math.floor(s.s/2);
        if(s.s>s.bs) s.bs=s.s;
      }else{ s.b[0].push(id); s.w.add(id); s.s=0; }
      s.t++; s.updateLevel(); s.save(); s.updateUI();
    },
    updateUI:function(){
      var bar=document.getElementById('tariq-stats-bar');
      if(!bar){
        var card=document.getElementById('card');
        if(card){ bar=document.createElement('div'); bar.id='tariq-stats-bar'; card.parentNode.insertBefore(bar,card); }
      }
      if(bar){
        var acc=this.t?Math.round(this.c/this.t*100):0;
        bar.innerHTML='<span class="'+(this.day>0?'active':'')+'">🎯 '+this.day+'/'+this.goal+'</span><span class="'+(this.s>=3?'active':'')+'">🔥 '+this.s+'</span><span>⭐ '+this.xp+' XP</span><span>'+this.levelName()+' Lv'+this.level+'</span><span>📊 '+acc+'%</span>'+(this.w.size?' <span>⚠️ '+this.w.size+'</span>':'');
      }
      var rm=document.getElementById('tariq-roadmap');
      if(!rm){
        var card2=document.getElementById('card');
        if(card2){
          rm=document.createElement('div'); rm.id='tariq-roadmap';
          rm.innerHTML='<div id="tariq-roadmap-line"></div><div id="tariq-roadmap-progress"></div><div id="tariq-roadmap-dots"></div>';
          card2.parentNode.insertBefore(rm,card2);
          var bar2=document.getElementById('tariq-stats-bar');
          if(bar2) bar2.parentNode.insertBefore(rm, bar2.nextSibling);
        }
      }
      if(rm){
        var dots=document.getElementById('tariq-roadmap-dots');
        var prog=document.getElementById('tariq-roadmap-progress');
        if(dots){
          var total=75, done=Math.min(this.c,total), h='';
          for(var i=0;i<total;i++){ var cls='tariq-dot'+(i<done?' done':'')+(i===done?' current':''); h+='<div class="'+cls+'"></div>'; }
          dots.innerHTML=h;
        }
        if(prog){ var pct=Math.min(100,Math.round(this.c/75*100)); prog.style.width='calc('+pct+'% - 40px)'; }
      }
    }
  };
  AI.init(); setTimeout(function(){AI.updateUI();},650);
  var o=window.selectOption;
  if(typeof o==='function'){
    window.selectOption=function(sel,cor){
      var el=document.getElementById('arabicWord'), id=el?(el.textContent||'').trim():'w_'+Date.now(), ok=sel===cor;
      setTimeout(function(){AI.move(id,ok);},35);
      if(ok){ try{if('vibrate' in navigator) navigator.vibrate(26);}catch(e){} }
      return o(sel,cor);
    };
  }
  window.TariqCautious=AI;
})();
</script>
