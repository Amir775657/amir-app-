<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>طريق الأمير 👑</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080A; --bg-e: #121216; --bg-e2: #1A1A22; --card: #1E1E28;
      --border: #2A2A3A; --text: #FFFFFF; --text-2: #A0A0B2; --text-3: #6A6B7A;
      --gold: #FFD84D; --gold2: #FFC81A; --gold-bg: rgba(255,216,77,0.08); --gold-bd: rgba(255,216,77,0.18);
      --danger: #FF5A5A; --danger-bg: rgba(255,90,90,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: 'Tajawal', sans-serif; -webkit-font-smoothing: antialiased; }
    .app { max-width: 440px; margin: 0 auto; min-height: 100vh; background: var(--bg); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }
    
    /* Header */
    .header { position: sticky; top: 0; z-index: 100; background: rgba(8,8,10,0.9); backdrop-filter: blur(20px); padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .h-left { display: flex; align-items: center; gap: 10px; }
    .h-logo { width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 18px; }
    .h-title { font-size: 15px; font-weight: 800; }
    .h-sub { font-size: 10px; color: var(--text-2); }
    
    .content { padding: 16px 16px 110px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .cn-char { font-size: 32px; font-weight: 900; color: #FFF; font-family: 'Noto Sans SC', sans-serif; }
    .cn-py { display: inline-block; font-size: 12px; color: var(--gold); background: var(--gold-bg); border: 1px solid var(--gold-bd); padding: 3px 8px; border-radius: 20px; margin-top: 6px; }
    
    /* Buttons & Controls */
    .play-btn { width: 42px; height: 42px; background: var(--bg-e2); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .action { flex: 1; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; font-size: 12px; border: 1px solid var(--border); background: var(--bg-e); color: var(--text-2); }
    .action-video { background: var(--gold); color: #000; border: none; font-weight: 800; }
    
    /* Recording & Preview */
    .preview { display: none; margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #000; }
    .preview.active { display: block; }
    .rec-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    
    .btn-primary { width: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); color: #000; border: none; padding: 12px; border-radius: 11px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .input-field { width: 100%; background: var(--bg-e); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 12px; outline: none; margin-bottom: 8px; font-family: 'Tajawal'; }
    .toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #18181B; border: 1px solid var(--gold); padding: 10px 18px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--gold); opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 3000; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="h-left">
      <div class="h-logo">👑</div>
      <div>
        <div class="h-title">طريق الأمير 100%</div>
        <div class="h-sub" id="headerSub">المستوى 1 • 0 XP</div>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- نموذج التحدي والجدول -->
    <div class="card" style="border-color: var(--gold-bd); background: var(--gold-bg);">
      <div style="font-weight: 800; color: var(--gold); margin-bottom: 10px;">🎯 تسجيل التحدي لجدول البيانات</div>
      <input id="userName" class="input-field" placeholder="الاسم الكامل" />
      <input id="userWallet" class="input-field" placeholder="رابط المحفظة / رقم الهاتف" />
      <input id="videoLink" class="input-field" placeholder="رابط فيديو التحدي (Drive / YouTube)" />
      <button class="btn-primary" onclick="submitData()">إرسال البيانات للجدول 🚀</button>
    </div>

    <!-- قائمة البطاقات اللسانية -->
    <div id="learn-container"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEDQ-pp8KYFkuxhNA8EnrJLkzvLuZsI-6fKzhPK0kQlhC9kuq8UWRnX-yJuosa2v2mfg/exec";

  const termsData = [
    ["你好", "nǐ hǎo", "ني هاو", "Hello", "مرحباً"],
    ["谢谢", "xiè xie", "شيه شيه", "Thank you", "شكراً"],
    ["多少钱", "duō shǎo qián", "دو شاو تشين", "How much", "كم السعر"],
    ["太贵了", "tài guì le", "تاي قوي لا", "Too expensive", "غالي جداً"],
    ["大货", "dà huò", "دا هو", "Bulk goods", "بضاعة كبيرة"]
  ];

  let _recorder = null, _stream = null, _timer = null, _chunks = [];

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  function renderLearn() {
    const container = document.getElementById('learn-container');
    let html = '';
    termsData.forEach((term, idx) => {
      html += `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="cn-char">${term[0]}</div>
              <div class="cn-py">${term[1]}</div>
            </div>
            <div class="play-btn" onclick="playAudio('${term[0]}', this)">🔊</div>
          </div>
          <div style="margin-top:10px; font-size:13px; font-weight:700;">🇸🇦 ${term[4]} | 🇬🇧 ${term[3]}</div>
          <div class="actions">
            <div class="action action-video" onclick="startVideo('${term[0]}', this)">📹 تسجيل فيديو</div>
          </div>
          <div class="preview" id="preview-${idx}"></div>
        </div>`;
    });
    container.innerHTML = html;
  }

  // 1. النطق المباشر المضمون
  function playAudio(text, btn) {
    if (!('speechSynthesis' in window)) {
      showToast("المتصفح لا يدعم النطق الصوتي");
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;

    const voices = window.speechSynthesis.getVoices();
    const cnVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN'));
    if (cnVoice) utterance.voice = cnVoice;

    window.speechSynthesis.speak(utterance);
    showToast("جاري النطق...");
  }

  // 2. تسجيل الفيديو مع العداد الدقيق
  async function startVideo(term, btn) {
    const card = btn.closest('.card');
    const idx = [...document.querySelectorAll('#learn-container .card')].indexOf(card);
    const prev = document.getElementById(`preview-${idx}`);

    if (btn.dataset.rec === 'true') { stopRec(); return; }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' }, audio: true
      });
      _stream = stream; _chunks = [];

      prev.innerHTML = `
        <video id="live-${idx}" autoplay muted playsinline style="width:100%;max-height:260px;background:#000;display:block;"></video>
        <div style="padding:10px;background:var(--bg-e);display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;align-items:center;gap:6px;color:var(--danger);font-size:12px;font-weight:700">
            <div class="rec-dot"></div>
            <span id="video-timer-${idx}">00:00</span>
          </div>
          <button onclick="stopRec()" style="background:var(--danger);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:800;cursor:pointer">إيقاف</button>
        </div>`;
      
      prev.classList.add('active');
      document.getElementById(`live-${idx}`).srcObject = stream;

      _recorder = new MediaRecorder(stream);
      _recorder.ondataavailable = e => { if (e.data.size > 0) _chunks.push(e.data); };
      _recorder.onstop = () => {
        const blob = new Blob(_chunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        prev.innerHTML = `
          <video controls playsinline src="${url}" style="width:100%;max-height:280px;background:#000"></video>
          <div style="padding:8px; background:var(--bg-e); text-align:center;">
            <a href="${url}" download="video-${term}.mp4" style="color:var(--gold); font-weight:800; text-decoration:none;">💾 حفظ الفيديو</a>
          </div>`;
        cleanup();
      };

      _recorder.start(100);
      btn.dataset.rec = 'true';
      btn.textContent = '⏹️ إيقاف التسجيل';

      // تشغيل العداد الزمني الحقيقي
      let startTime = Date.now();
      if (_timer) clearInterval(_timer);
      _timer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        const timerEl = document.getElementById(`video-timer-${idx}`);
        if (timerEl) timerEl.textContent = `${mins}:${secs}`;
      }, 1000);

    } catch (e) {
      showToast('يرجى إعطاء الصلاحية للكاميرا 📹');
    }
  }

  function stopRec() {
    if (_recorder && _recorder.state !== 'inactive') _recorder.stop();
    cleanup();
  }

  function cleanup() {
    if (_stream) { _stream.getTracks().forEach(t => t.stop()); _stream = null; }
    if (_timer) { clearInterval(_timer); _timer = null; }
    document.querySelectorAll('.action-video').forEach(b => {
      b.dataset.rec = 'false';
      b.textContent = '📹 تسجيل فيديو';
    });
  }

  // 3. إرسال البيانات للجدول
  async function submitData() {
    const name = document.getElementById('userName').value.trim();
    const wallet = document.getElementById('userWallet').value.trim();
    const link = document.getElementById('videoLink').value.trim();

    if (!name || !link) { showToast('يرجى كتابة الاسم ورابط الفيديو'); return; }

    showToast('جاري الإرسال للجدول...');
    try {
      const formData = new URLSearchParams();
      formData.append("name", name);
      formData.append("wallet", wallet);
      formData.append("videoLink", link);
      formData.append("mode", "single");
      formData.append("timestamp", new Date().toISOString());

      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });

      showToast('🏆 تم حفظ البيانات بالجدول بنجاح!');
      document.getElementById('userName').value = '';
      document.getElementById('userWallet').value = '';
      document.getElementById('videoLink').value = '';
    } catch (e) {
      showToast('حدث خطأ أثناء الإرسال');
    }
  }

  renderLearn();
</script>
</body>
</html>
